# 전체 실행:  docker compose up -d --build
# 사내 폐쇄망이라면 .env 에 PIP_INDEX_URL 을 넣어 사내 PyPI 미러를 쓰세요.

# 공식 앱 7개가 함께 쓰는 설정. 아래 app-* 서비스들이 이것을 그대로 물려받습니다.
x-official-app: &official-app
  build:
    context: ./official_apps
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  image: workflow-auto-official-apps
  env_file: [.env]
  volumes:
    # 앱들이 만든 기록과 채워 만든 파일이 여기에 쌓입니다.
    - officialdata:/srv/data
  restart: unless-stopped

x-official-app-env: &official-app-env
  DATA_DIR: /srv/data
  # 산출물 앱이 플랫폼 양식 저장소도 같이 쓰게 하려면 .env 에서 채우세요.
  WORKFLOW_API_BASE: ${WORKFLOW_API_BASE:-}
  WORKFLOW_API_USER: ${WORKFLOW_API_USER:-}
  WORKFLOW_API_TOKEN: ${WORKFLOW_API_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 백엔드 API + 오케스트레이터
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://workflow:workflow@postgres:5432/workflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # 관리자 계정은 .env 의 ADMIN_ID / ADMIN_PASSWORD 로 정해지고 첫 기동 때 만들어집니다.
      # (위 env_file 로 그대로 전달됩니다. 비밀번호는 이 파일에 적지 마세요)
    volumes:
      # 앱 목록 파일을 컨테이너 안에서 읽을 수 있게 붙여 줍니다.
      - ./config:/srv/config:ro
      # 한 번씩 손으로 돌리는 정리 스크립트(scripts/seal_secrets.py 등)
      - ./scripts:/srv/scripts:ro
      # 올린 앱 패키지와 양식 파일이 여기에 쌓입니다.
      - appdata:/srv/data
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # 오래 걸리는 요청을 백그라운드에서 처리. 바쁘면 이 서비스만 늘리면 됩니다.
  #   docker compose up -d --scale worker=3
  worker:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    command: ["python", "-m", "app.worker.main"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://workflow:workflow@postgres:5432/workflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # 관리자 계정은 .env 의 ADMIN_ID / ADMIN_PASSWORD 로 정해지고 첫 기동 때 만들어집니다.
      # (위 env_file 로 그대로 전달됩니다. 비밀번호는 이 파일에 적지 마세요)
      AUTO_CREATE_TABLES: "false"
      SEED_FILE: ""
      # 생존 확인은 backend 컨테이너에서만 돕니다(중복 방지).
      HEALTHCHECK_INTERVAL_SECONDS: "0"
    volumes:
      - ./config:/srv/config:ro
      - appdata:/srv/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # 매일 새벽에 DB 와 파일을 백업합니다. 자세한 설명은 docs/BACKUP.md
  #   지금 한 번 뜨기 : docker compose run --rm backup /srv/scripts/backup.sh
  #   되살리기        : docker compose run --rm backup /srv/scripts/restore.sh
  backup:
    # postgres 와 같은 이미지를 씁니다(pg_dump 가 들어 있고, 이미 받아 둔 이미지라서).
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://workflow:workflow@postgres:5432/workflow}
      BACKUP_DIR: /srv/backups
      BACKUP_SOURCES: /srv/sources
      # 며칠치를 남길지. 지난 것은 자동으로 지웁니다(디스크가 꽉 차면 서버가 멈춥니다).
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # 몇 시에 뜰지 (0~23). 사람이 안 쓰는 시간으로.
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      # 회사 공유 폴더에도 한 벌 더 두려면 .env 에서 /srv/secondary 로 켜세요.
      BACKUP_SECONDARY_DIR: ${BACKUP_SECONDARY_DIR:-}
      TZ: ${TZ:-Asia/Seoul}
    entrypoint: ["/bin/sh", "/srv/scripts/backup_daily.sh"]
    volumes:
      - ./scripts:/srv/scripts:ro
      # 백업 파일은 호스트 폴더에 둡니다. 밖으로 복사해 가기 쉬우라고.
      - ${BACKUP_HOST_DIR:-./backups}:/srv/backups
      # 회사 공유 폴더 (안 쓰면 아래 기본 폴더가 붙고, 위 BACKUP_SECONDARY_DIR 이 비어 있어 복사하지 않습니다)
      - ${BACKUP_SECONDARY_HOST_DIR:-./backups}:/srv/secondary
      # 백업할 데이터 폴더들. 실수로 건드리지 않게 전부 읽기 전용(:ro)으로 붙입니다.
      - appdata:/srv/sources/appdata:ro
      - maildata:/srv/sources/maildata:ro
      - meetingdata:/srv/sources/meetingdata:ro
      - tasksdata:/srv/sources/tasksdata:ro
      - officialdata:/srv/sources/officialdata:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # 되살릴 때만 쓰는 일회용 서비스. 평소에는 뜨지 않습니다(profiles 덕분).
  # 백업 서비스는 데이터 폴더를 읽기 전용으로 붙이기 때문에, 되살리기는 쓰기가
  # 되는 이 서비스로 따로 합니다.
  #   docker compose stop backend worker
  #   docker compose run --rm restore /srv/scripts/restore.sh            # 목록 보기
  #   docker compose run --rm restore /srv/scripts/restore.sh 2026-09-20_0300 --yes
  #   docker compose start backend worker
  restore:
    profiles: ["restore"]
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://workflow:workflow@postgres:5432/workflow}
      BACKUP_DIR: /srv/backups
      BACKUP_SOURCES: /srv/sources
      TZ: ${TZ:-Asia/Seoul}
    entrypoint: ["/bin/sh"]
    volumes:
      - ./scripts:/srv/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/srv/backups
      # 되살리기는 파일을 써야 하므로 여기서는 읽기 전용이 아닙니다.
      - appdata:/srv/sources/appdata
      - maildata:/srv/sources/maildata
      - meetingdata:/srv/sources/meetingdata
      - tasksdata:/srv/sources/tasksdata
      - officialdata:/srv/sources/officialdata
    depends_on:
      postgres: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      # 공식 앱(메일함·할 일) 화면이 부를 주소
      NEXT_PUBLIC_MAIL_API: ${NEXT_PUBLIC_MAIL_API:-http://localhost:9101}
      NEXT_PUBLIC_TASKS_API: ${NEXT_PUBLIC_TASKS_API:-http://localhost:9103}
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped

  # ── 아래 둘은 "예시"입니다. 실제 운영에서는 지우고,
  #    개발자들이 각자 띄운 어댑터 주소를 앱스토어에 등록하면 됩니다. ──

  # 기존 앱(바이브 코딩으로 만든 웹앱이라고 가정). 한 줄도 고치지 않습니다.
  example-legacy:
    build:
      context: ./example_app/legacy_app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped

  # 그 앱 옆에 붙인 얇은 MCP 어댑터. 오케스트레이터는 이 주소로 앱을 부릅니다.
  example-adapter:
    build:
      context: ./example_app/mcp_adapter
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      APP_BASE_URL: http://example-legacy:8100
      PORT: "9001"
    ports: ["9001:9001"]
    depends_on: [example-legacy]
    restart: unless-stopped

  # ── 공식 앱 3개 ─────────────────────────────────────────────────────
  #   첫 업무 시나리오("회의록 → 할 일 → 담당자 메일 → 회신 리마인드")를
  #   담당합니다. 앱스토어에는 config/apps.seed.example.json 로 자동 등록됩니다.
  #   플랫폼이 아니라 "등록된 앱"이므로, 각자 자기 DB(SQLite)만 씁니다.

  app-mail:
    build:
      context: ./official_apps/mail
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    env_file: [.env]
    environment:
      PORT: "9101"
      MAIL_DB: /srv/data/mail.db
      # mock=가짜 메일함(기본), smtp=사내 메일. 회사에서는 값만 바꿉니다.
      MAIL_ADAPTER: ${MAIL_ADAPTER:-mock}
    volumes:
      - maildata:/srv/data
    ports: ["9101:9101"]
    restart: unless-stopped

  app-meeting:
    build:
      context: ./official_apps/meeting
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    # 회의록 요약에 LLM 을 씁니다. .env 의 LLM_* 값을 그대로 물려받습니다.
    env_file: [.env]
    environment:
      PORT: "9102"
      MEETING_DB: /srv/data/meeting.db
    volumes:
      - meetingdata:/srv/data
    ports: ["9102:9102"]
    restart: unless-stopped

  app-tasks:
    build:
      context: ./official_apps/tasks
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    env_file: [.env]
    environment:
      PORT: "9103"
      TASKS_DB: /srv/data/tasks.db
    volumes:
      - tasksdata:/srv/data
    ports: ["9103:9103"]
    restart: unless-stopped

  # ── 공식 앱 7개 (official_apps/) ────────────────────────────────────
  # 이미지 하나에 7개 앱이 들어 있고, command 로 어떤 앱을 띄울지 고릅니다.
  # 아래 &official-app 은 반복되는 설정을 한 번만 쓰기 위한 YAML 문법입니다.

  app-dev-projects:
    <<: *official-app
    command: ["python", "-m", "dev_projects.server"]
    environment:
      <<: *official-app-env
      PORT: "9111"
      # 채운 엑셀·워드 파일을 내려받을 때 쓰는 주소
      PUBLIC_BASE_URL: ${OFFICIAL_APPS_HOST:-http://localhost}:9111
    ports: ["9111:9111"]

  app-achievements:
    <<: *official-app
    command: ["python", "-m", "achievements.server"]
    environment:
      <<: *official-app-env
      PORT: "9112"
    ports: ["9112:9112"]

  app-weekly-report:
    <<: *official-app
    command: ["python", "-m", "weekly_report.server"]
    environment:
      <<: *official-app-env
      PORT: "9113"
    ports: ["9113:9113"]

  app-toolbox:
    <<: *official-app
    command: ["python", "-m", "toolbox.server"]
    environment:
      <<: *official-app-env
      PORT: "9114"
    ports: ["9114:9114"]

  app-meeting-scheduler:
    <<: *official-app
    command: ["python", "-m", "meeting_scheduler.server"]
    environment:
      <<: *official-app-env
      PORT: "9115"
    ports: ["9115:9115"]

  app-approvals:
    <<: *official-app
    command: ["python", "-m", "approvals.server"]
    environment:
      <<: *official-app-env
      PORT: "9116"
    ports: ["9116:9116"]

  app-docs-assistant:
    <<: *official-app
    command: ["python", "-m", "docs_assistant.server"]
    environment:
      <<: *official-app-env
      PORT: "9117"
    ports: ["9117:9117"]

volumes:
  pgdata:
  appdata:
  maildata:
  meetingdata:
  tasksdata:

  officialdata:
